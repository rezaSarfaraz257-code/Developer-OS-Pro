name: Security

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    # Scan lockfiles and pinned Python requirements directly. This works even
    # when the repository's optional GitHub Dependency Graph is disabled.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve compatible frontend security updates
        working-directory: Frontend
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Audit frontend lockfile
        working-directory: Frontend
        run: npm audit --audit-level=high
      - name: Export updated frontend lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile-remediation
          path: Frontend/package-lock.json
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit backend dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r Backend/requirements.txt
      - name: Audit Runner dependencies
        run: pip-audit -r Runner/requirements.txt
