name: Security

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    # Scan lockfiles and pinned Python requirements directly. This works even
    # when the repository's optional GitHub Dependency Graph is disabled.
    # Only same-repository PRs may receive a narrowly scoped lockfile commit.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve compatible frontend security updates
        working-directory: Frontend
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Audit frontend lockfile
        working-directory: Frontend
        run: npm audit --audit-level=high
      - name: Commit patched frontend lockfile
        if: success()
        run: |
          if git diff --quiet -- Frontend/package-lock.json; then
            echo "Frontend lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/package-lock.json
          git commit -m "fix(frontend): patch vulnerable npm dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit backend dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r Backend/requirements.txt
      - name: Audit Runner dependencies
        run: pip-audit -r Runner/requirements.txt
