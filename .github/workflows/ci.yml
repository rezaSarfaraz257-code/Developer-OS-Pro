name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy
      - run: python manage.py test

  runner-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y acl
      - run: python -m pip install --upgrade pip
      - run: pip install -r Runner/requirements.txt
      - run: sudo -E "$(command -v python)" -m unittest discover -s Runner -p 'test_*.py' -v

  deployment-config:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-for-compose-validation-not-used-in-deployment
      POSTGRES_PASSWORD: ci-only-password
      IDE_RUNNER_TOKEN: ci-only-runner-token
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t developeros-runner:ci ./Runner
      - name: Verify Runner isolation inside its Docker container
        env:
          RUNNER_SMOKE_URL: http://127.0.0.1:18080
          RUNNER_SMOKE_TOKEN: ci-runner-smoke-token
        run: |
          docker volume create runner-smoke-workspaces
          docker run -d --name runner-smoke \
            --read-only --init \
            --tmpfs /tmp:rw,nosuid,size=128m \
            --mount source=runner-smoke-workspaces,target=/workspaces \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETPCAP \
            --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            --pids-limit 256 --memory 1g --cpus 2 \
            -e IDE_RUNNER_TOKEN=ci-runner-smoke-token \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -p 127.0.0.1:18080:8080 developeros-runner:ci
          trap 'docker logs runner-smoke 2>&1 || true; docker rm -f runner-smoke >/dev/null 2>&1 || true; docker volume rm runner-smoke-workspaces >/dev/null 2>&1 || true' EXIT
          python Runner/docker_smoke_test.py
